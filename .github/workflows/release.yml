name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

defaults:
  run:
    working-directory: apogee-extension

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apogee-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and package extension
        run: npm run package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            apogee-*-chrome.zip
            apogee-*-mozilla.xpi
          generate_release_notes: true

      - name: Publish to Chrome Web Store
        if: env.CWS_CLIENT_ID != ''
        uses: fregante/chrome-webstore-upload-action@v4
        with:
          extension-id: ${{ secrets.CWS_EXTENSION_ID }}
          client-id: ${{ secrets.CWS_CLIENT_ID }}
          client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}
          file-name: 'apogee-*-chrome.zip'

      - name: Publish to Mozilla Add-ons (AMO)
        if: env.AMO_API_KEY != ''
        run: |
          npx web-ext sign \
            --source-dir dist/firefox \
            --api-key ${{ secrets.AMO_API_KEY }} \
            --api-secret ${{ secrets.AMO_API_SECRET }}
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
